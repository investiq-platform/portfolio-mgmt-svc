services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: investiq
      POSTGRES_USER: investiq
      POSTGRES_PASSWORD: investiq
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../market-data-ingestion-svc/db/schema.sql:/docker-entrypoint-initdb.d/01-market-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investiq -d investiq"]
      interval: 5s
      timeout: 3s
      retries: 20

  market-data:
    build: ../market-data-ingestion-svc
    environment:
      DATABASE_URL: postgresql://investiq:investiq@postgres:5432/investiq
      MFAPI_BASE_URL: https://api.mfapi.in
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  portfolio-mgmt:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/investiq
      DATABASE_USERNAME: investiq
      DATABASE_PASSWORD: investiq
      MARKET_DATA_BASE_URL: http://market-data:8000
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      market-data:
        condition: service_healthy

volumes:
  postgres-data:
