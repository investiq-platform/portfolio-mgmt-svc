spring.application.name=portfolio-mgmt-svc
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio_mgmt}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.graphql.graphiql.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
market-data.base-url=${MARKET_DATA_BASE_URL:http://localhost:8000}
market-data.connect-timeout=2s
market-data.read-timeout=30s
